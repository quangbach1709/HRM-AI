# ===============================
# 1. SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# 2. DATASOURCE (DOCKER)
# ===============================
spring.datasource.url=jdbc:postgresql://postgres-db:5432/hr_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 3. JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 4. FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# 5. FIREBASE CONFIG (Placeholder)
# ===============================
#firebase.config.path=classpath:firebase-service-account.json

# ===============================
# 6. JWT CONFIGURATION
# ===============================
jwt.secret=HRMSystemSecretKey2025MustBeAtLeast32Characters
jwt.expiration=86400000

# ===============================
# 7. AI-SERVICE CONFIGURATION
# ===============================
ai.service.url=http://ai-service:8000

# ===============================
# 8. MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=mongodb://root:123456@mongo-db:27017/hr_dashboard_db?authSource=admin

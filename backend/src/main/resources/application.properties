# ===============================
# 1. SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# 2. DATASOURCE (POSTGRESQL)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hr_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 3. JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 4. FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# 5. FIREBASE CONFIG (Placeholder)
# ===============================
#firebase.config.path=classpath:firebase-service-account.json

# ===============================
# 6. JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# 7. AI-SERVICE CONFIGURATION
# ===============================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ===============================
# 8. MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:hr_dashboard_db}?authSource=admin

# ===============================
# 9. RABBITMQ CONFIGURATION
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# ===============================
# 10. MAIL CONFIGURATION
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# 11. MINIO CONFIGURATION
# ===============================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9002}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:hrm-files}

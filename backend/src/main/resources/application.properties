# ===============================
# 1. SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# 2. DATASOURCE (LOCALHOST)
# ===============================
# Format: jdbc:postgresql://localhost:5432/[DATABASE_NAME]
spring.datasource.url=jdbc:postgresql://localhost:5432/hr_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 3. JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 4. FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# 5. FIREBASE CONFIG (Placeholder)
# ===============================
#firebase.config.path=classpath:firebase-service-account.json

# ===============================
# 6. JWT CONFIGURATION
# ===============================
jwt.secret=HRMSystemSecretKey2025MustBeAtLeast32Characters
jwt.expiration=86400000

# ===============================
# 7. AI-SERVICE CONFIGURATION
# ===============================
ai.service.url=http://localhost:8000

# ===============================
# 8. MONGODB CONFIGURATION
# ===============================
# Option 1: Với authentication (authSource=admin)
spring.data.mongodb.uri=mongodb://root:123456@localhost:27017/hr_dashboard_db?authSource=admin

# Option 2: Không authentication (comment Option 1, uncomment dòng dưới)
# spring.data.mongodb.uri=mongodb://localhost:27017/hr_dashboard_db

# ===============================
# 9. RABBITMQ CONFIGURATION
# ===============================
# docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:management
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

